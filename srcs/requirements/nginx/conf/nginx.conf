server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lcalero.42.fr;
    
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    root /var/www/html;
    index index.php index.html;

    # Static page (bonus)
    location /static-page {
        alias /var/www/static/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Adminer at /adminer/ (unchanged - working)
    location ^~ /adminer/ {
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/adminer/(.*) /$1 break;
    }

	location ^~ /cadvisor/ {
		proxy_pass http://cadvisor:8080;   # ← no trailing slash, path is preserved
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

    # Static JS (bonus)
    location /static-page/js/ {
        alias /var/www/static/js/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WordPress main location
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP processing for WordPress
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    }
}