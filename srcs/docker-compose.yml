
services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:42
    container_name: mariadb
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: [
        "CMD-SHELL",
        "mariadb -u root -p$$(cat /run/secrets/db_root_password) -e 'SELECT 1;'"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - db_password
      - db_root_password
    restart: unless-stopped
  wordpress:
    build: ./requirements/wordpress
    image: wordpress:42
    container_name: wordpress
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      mariadb:
       condition: service_healthy 
    networks:
      - inception
    healthcheck:
      test: ["CMD", "pgrep", "php-fpm"]
      interval: 30s
      timeout: 5s
      retries: 3
    secrets:
      - db_password
      - credentials
    restart: unless-stopped
  nginx:
    build: ./requirements/nginx
    image: nginx:42
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
      - ./requirements/bonus/static_website/tools:/var/www/static:ro
    depends_on:
      - wordpress
    networks:
      - inception
    restart: unless-stopped
  adminer:
    build: ./requirements/bonus/adminer
    image: adminer:42
    container_name: adminer
    networks:
      - inception
    depends_on:
      - mariadb
    restart: unless-stopped
  redis:
    build: ./requirements/bonus/redis
    image: redis-cache:42
    container_name: redis
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress
    restart: unless-stopped
  ftp:
    build: ./requirements/bonus/ftp
    image: vsftpd:42
    container_name: vsftpd
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    env_file:
      - .env
    ports:
      - "21:21"
      - "20:20"
      - "40000-40005:40000-40005"
    depends_on:
      - wordpress
    restart: unless-stopped
  cadvisor:
    build: ./requirements/bonus/cadvisor
    image: cadvisor:42
    container_name: cadvisor
    networks:
      - inception
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro 
      - /sys:/sys:ro 
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUMES_LOCATION}/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUMES_LOCATION}/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
